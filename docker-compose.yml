# Throwaway PostgreSQL for the Problem 02 tests (Postgres dialect is the closest free match to Redshift).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports: ["54320:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
